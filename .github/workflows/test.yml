name: test

# The suite previously ran only as a release gate, so a PR could go green with
# nothing having run it. This is what branch protection can require.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range, per pyproject's
        # requires-python and classifiers.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --locked fails if uv.lock has drifted from pyproject.toml, so the tests
      # and the release build resolve the same dependency set.
      - run: uv run --locked --group dev pytest -q

  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Guards the hardening in this directory: unpinned actions, persisted
      # credentials, cache poisoning, template injection. Pinned so a zizmor
      # release cannot fail an unrelated PR — bump deliberately. The token is
      # what enables the online audits (stale/known-vulnerable action refs);
      # without it zizmor silently runs offline and skips them.
      - run: uvx zizmor@1.29.0 .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # lokf.yaml is the single source of truth; every other artifact is generated
  # from it and committed. Nothing used to check that the committed copies
  # matched their source, so a schema edit could merge with stale artifacts —
  # which happened twice. This is what makes that impossible, and it is only
  # enforceable because lokf-build is now byte-reproducible.
  generated-fresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev

      - name: Regenerate every artifact from lokf.yaml
        run: uv run lokf-build

      - name: Fail if the committed artifacts differ from a fresh build
        run: |
          if ! git diff --exit-code; then
            echo "::error::Committed artifacts do not match a fresh build of lokf.yaml. Run 'just build' and commit the result."
            exit 1
          fi
