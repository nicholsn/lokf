# A domain vocabulary that imports lokf and the published schema in
# vocabulary.yaml, and ranges that schema's governedBy slot over Concept on
# Regulation alone, by slot_usage.
id: https://ex.org/schema/domain-reranges-a-slot
name: domain_reranges_a_slot
imports:
  - linkml:types
  - ../../../lokf
  - vocabulary
default_prefix: domain
prefixes:
  domain: https://ex.org/schema/domain/
  linkml: https://w3id.org/linkml/
classes:
  Regulation:
    is_a: Concept
    slots:
      - governedBy
    slot_usage:
      governedBy:
        range: Concept
  Memo:
    is_a: Concept
    slots:
      - governedBy
