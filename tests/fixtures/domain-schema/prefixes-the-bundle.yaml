# A domain schema that declares a prefix for the bundle's own namespace, so a
# relation target can be written as a CURIE (taughtBy: [kb:real]); the bundle
# in prefixed-target/ does. The relative import reaches the repo-root lokf.yaml.
id: https://ex.org/schema/domain-prefixes-the-bundle
name: domain_prefixes_the_bundle
imports:
  - linkml:types
  - ../../../lokf
default_prefix: domain
prefixes:
  domain: https://ex.org/schema/domain/
  kb: https://ex.org/kb/
  linkml: https://w3id.org/linkml/
classes:
  Module:
    is_a: Concept
    slots:
      - taughtBy
slots:
  taughtBy:
    range: Concept
    multivalued: true
    slot_uri: domain:taughtBy
